# ============================================
# K8s Deployment - 光伏预测服务
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pv-forecast-service
  namespace: ems-system
  labels:
    app: pv-forecast
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pv-forecast
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pv-forecast
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      containers:
        - name: pv-forecast
          image: registry.example.com/ems/pv-forecast:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: ENV
              value: "production"
            - name: TZ
              value: "Asia/Shanghai"
            - name: PV_CAPACITY_KW
              value: "5000"
            - name: PV_LATITUDE
              value: "39.61"
            - name: PV_LONGITUDE
              value: "110.07"
            - name: FORECAST_HORIZON_HOURS
              value: "4"
            - name: FORECAST_TIME_STEP_MINUTES
              value: "15"
            - name: SOLVER_ENGINE
              value: "pulp"
            - name: INFLUXDB_URL
              valueFrom:
                configMapKeyRef:
                  name: pv-forecast-config
                  key: influxdb_url
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pv-forecast-secrets
                  key: influxdb_token
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: pv-forecast-config
                  key: kafka_servers
            - name: S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: pv-forecast-config
                  key: s3_endpoint
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pv-forecast-secrets
                  key: s3_access_key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: pv-forecast-secrets
                  key: s3_secret_key
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: model-storage
              mountPath: /app/models/storage
            - name: logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: pv-model-storage-pvc
        - name: logs
          emptyDir: {}
      restartPolicy: Always
---
# ============================================
# K8s Service - 光伏预测服务
# ============================================
apiVersion: v1
kind: Service
metadata:
  name: pv-forecast-service
  namespace: ems-system
  labels:
    app: pv-forecast
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
  selector:
    app: pv-forecast
---
# ============================================
# K8s ConfigMap - 配置
# ============================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: pv-forecast-config
  namespace: ems-system
data:
  influxdb_url: "http://influxdb.ems-system:8086"
  influxdb_org: "ems-org"
  influxdb_bucket: "pv-forecast"
  kafka_servers: "kafka.ems-system:9092"
  s3_endpoint: "http://minio.ems-system:9000"
  s3_bucket: "pv-raw-data"
  log_level: "INFO"
---
# ============================================
# K8s Secret - 敏感信息（生产环境应使用外部密钥管理）
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: pv-forecast-secrets
  namespace: ems-system
type: Opaque
stringData:
  influxdb_token: "pv-forecast-token-change-me"
  s3_access_key: "minioadmin"
  s3_secret_key: "minioadmin-change-me"
---
# ============================================
# K8s PVC - 模型存储
# ============================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pv-model-storage-pvc
  namespace: ems-system
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: nfs-storage
---
# ============================================
# K8s HPA - 自动扩缩容
# ============================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pv-forecast-hpa
  namespace: ems-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pv-forecast-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
